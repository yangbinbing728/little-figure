<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIDE — Little Figures, Big City</title>
  <link rel="stylesheet" href="ride.css">
</head>

<body>
  <main class="ride-page">

    <header class="ride-header">
      <div>
        <p class="eyebrow">LITTLE FIGURES, BIG CITY</p>
        <h1>RIDE</h1>
        <p class="instruction">CHOOSE A ROUTE TO EXPLORE</p>
      </div>

      <a class="home-logo" href="index.html" aria-label="Back to home">
        <img src="images/ride1.png" alt="">
      </a>
    </header>

    <div class="map-label">NEW YORK CITY</div>

    <section class="ride-stops" aria-label="Ride destinations">
      <article class="ride-card">
        <img src="images/central-park.jpg" alt="Central Park">
        <h2>CENTRAL PARK LOOP</h2>
        <p>A ride through the trees and open paths.</p>
      </article>

      <article class="ride-card">
        <img src="images/hudson-greenway.jpg" alt="Hudson River Greenway">
        <h2>HUDSON RIVER GREENWAY</h2>
        <p>Follow the river along the west side of Manhattan.</p>
      </article>

      <article class="ride-card">
        <img src="images/brooklyn-bridge.jpg" alt="Brooklyn Bridge">
        <h2>BROOKLYN BRIDGE</h2>
        <p>Ride across the bridge and look back at the skyline.</p>
      </article>
    </section>

  </main>
</body>
</html>
